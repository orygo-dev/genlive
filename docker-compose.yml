services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: genmeet
      MYSQL_DATABASE: genmeet
      MYSQL_USER: genmeet
      MYSQL_PASSWORD: genmeet
    ports:
      - "3306:3306"
    volumes:
      - genmeet_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-ugenmeet",
          "-pgenmeet",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  genmeet_mysql_data:
